<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel de convidados</title><link rel="stylesheet" href="/style.css"></head><body><main class="page-shell admin-page">
<section id="loginBox" class="card login-box"><img class="logo-ds" src="/assets/ds-logo.png" alt="DS"><h2>Painel administrativo</h2><label for="senha">Senha</label><input id="senha" type="password" inputmode="numeric" placeholder="Digite a senha"><button id="entrar" class="btn primary">Entrar</button><p id="loginMsg" class="message"></p></section>
<section id="painel" class="hidden"><div class="card"><div class="admin-header"><div><p class="eyebrow">DIRLAINE SOUZA</p><h1>Painel de convidados</h1></div><button id="sair" class="small-btn no-print">Sair</button></div><div class="stats"><div class="stat"><span>Total confirmado</span><b id="total">0</b></div><div class="stat"><span>Atualizado</span><b id="atualizado" style="font-size:20px">--</b></div></div><div class="toolbar no-print"><input id="busca" placeholder="Pesquisar nome ou telefone"><button id="exportar" class="small-btn">Exportar CSV</button><button onclick="window.print()" class="small-btn">Imprimir</button></div><p id="painelMsg" class="message"></p><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Telefone</th><th>Observação</th><th>Data</th><th class="no-print">WhatsApp</th></tr></thead><tbody id="lista"></tbody></table></div></div></section>
</main><script src="/painel.js" defer></script></body></html>
